[project]
name = "wingmen"
version = "0.6.25"
description = "A focused terminal workspace for collaborating with ACP coding agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual[syntax]==8.2.7",
    "click==8.4.0",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-speedups==0.2.1",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "setproctitle==1.3.7",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
]

[project.scripts]
wingmen = "wingmen.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wingmen"]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "textual-dev>=1.8.0",
]
