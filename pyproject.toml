[project]
name = "codeswarm"
version = "0.6.39"
description = "A focused terminal workspace for collaborating with ACP coding agents."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
keywords = [
    "acp",
    "agent-client-protocol",
    "ai",
    "coding-agents",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "textual[syntax]==8.2.7",
    "click==8.4.0",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-speedups==0.2.1",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "setproctitle==1.3.7",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
]

[project.scripts]
codeswarm = "codeswarm.cli:main"

[project.urls]
Documentation = "https://github.com/HainanZhao/codeswarm/blob/main/docs/USER_MANUAL.md"
Homepage = "https://github.com/HainanZhao/codeswarm"
Issues = "https://github.com/HainanZhao/codeswarm/issues"
Repository = "https://github.com/HainanZhao/codeswarm"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeswarm"]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "textual-dev>=1.8.0",
]
