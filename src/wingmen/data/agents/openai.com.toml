# Schema defined in agent_schema.py
# https://github.com/openai/codex

identity = "openai.com"
name = "Codex CLI"
short_name = "codex"
url = "https://developers.openai.com/codex/cli/"
protocol = "acp"
author_name = "OpenAI"
author_url = "https://www.openai.com/"
publisher_name = "OpenAI"
publisher_url = "https://openai.com/"
type = "coding"
description = "OpenAI's terminal coding agent, launched through its official ACP adapter."
tags = []
run_command."*" = "npx -y @agentclientprotocol/codex-acp"
detect_command."*" = "codex"

help = '''
# Codex CLI

**Lightweight coding agent that runs in your terminal**

Codex CLI is OpenAI's terminal-based coding agent. Wingmen launches the
official `@agentclientprotocol/codex-acp` adapter over stdio.

## Features

- **Agent Client Protocol (ACP)**: Official stdio adapter for seamless editor integration
- **Zed Integration**: Built-in support in Zed IDE (v0.208+)
- **Terminal-First**: Designed for developers who live in the command line

## ACP Integration

The official adapter translates between ACP and the Codex App Server. It is
downloaded on first launch with `npx`.

## Installation

Install globally via npm or Homebrew:
- npm: `npm i -g @openai/codex`
- Homebrew: `brew install --cask codex`

---

**GitHub**: https://github.com/openai/codex
**ACP Adapter**: https://github.com/agentclientprotocol/codex-acp
'''

[actions."*".install]
command = "npm install -g @openai/codex @agentclientprotocol/codex-acp"
description = "Install Codex CLI and its ACP adapter"
