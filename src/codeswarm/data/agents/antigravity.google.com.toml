# Antigravity CLI (`agy`)

**AI-first coding and multi-agent workflows in your terminal**

Google Antigravity CLI (`agy`) provides advanced agentic capabilities, reasoning, and context management. CodeSwarm connects directly through agy's structured stream-JSON interface.

## Features

- **Agent Client Protocol (ACP)**: Stdio adapter for seamless CodeSwarm multi-agent relay integration
- **Subagents & Skills**: Multi-agent delegation and skill execution
- **Terminal-First**: Built for fast interactive and automated development workflows

## CodeSwarm integration

CodeSwarm launches `agy` directly. This avoids a third-party ACP bridge and its private database parsing, while retaining streamed replies, tool cards, session resume, and relay support.

## Installation

Install Antigravity CLI:
- Follow instructions at https://antigravity.google/docs/cli/reference
